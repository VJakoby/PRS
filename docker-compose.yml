name: engram
services:
  engram:
    build: .
    container_name: engram
    ports:
      - "127.0.0.1:3002:3002"    # accessible from host
    networks:
      - pragma-net               # accessible internally
    volumes:
      - ./sources.json:/app/sources.json:ro
      - ./data:/app/data
      - cache_data:/app/cache
      # Primary local notes directory (single-root/default setup)
      - ${NOTES_PATH:-./notes}:/app/notes:ro
      # Optional additional local notes directories
      - ${NOTES_PATH_2:-./.docker-empty/notes-2}:/app/notes-2:ro
      - ${NOTES_PATH_3:-./.docker-empty/notes-3}:/app/notes-3:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.75"

volumes:
  cache_data:

networks:
  pragma-net:
    external: true
    name: pragma-net
    #driver: bridge
