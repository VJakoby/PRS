version: "3.9"
services:
  engram:
    build: .
    container_name: engram-kb-indexer
    ports:
      - "127.0.0.1:3002:3002"    # accessible from host
    networks:
      - pragma-net               # accessible internally
    volumes:
      - ./sources.json:/app/sources.json:ro
      - ./data:/app/data
      - cache_data:/app/cache
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.75"

volumes:
  cache_data:

networks:
  pragma-net:
    external: true
