<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGRAM</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* PRAGMA-inspired colors - dark mode */
            --bg-primary: #1a1a1f;
            --bg-secondary: #1f1f26;
            --bg-tertiary: #26262f;
            --border-color: #35353f;
            --text-primary: #c9d8ec;
            --text-secondary: #8fa3bc;
            --accent-blue: #7c3aed;
            --accent-blue-hover: #6d28d9;
            --accent-green: #34d399;
            --accent-green-hover: #10b981;
            --accent-purple: #a78bfa;
            --accent-red: #f87171;
            --shadow-color: rgba(124, 58, 237, 0.15);
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8eef6;
            --border-color: #c8d7e8;
            --text-primary: #1a2535;
            --text-secondary: #3a5068;
            --accent-blue: #5b21b6;
            --accent-blue-hover: #6d28d9;
            --accent-green: #059669;
            --accent-green-hover: #047857;
            --accent-purple: #7c3aed;
            --accent-red: #dc2626;
            --shadow-color: rgba(91, 33, 182, 0.12);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 500;
            -webkit-font-smoothing: antialiased;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header - Professional with logo */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 32px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin: 0;
        }

        .logo-text p {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin: 0;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-blue);
        }

        .theme-toggle-text {
            font-size: 14px;
            font-weight: 600;
        }


        /* Search Section - Prominent box */
        .search-section {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .search-box {
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            transition: all 0.2s;
            outline: none;
        }

        #searchInput:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--shadow-color);
        }

        .search-hint {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        

        /* Filter Pills - Squared buttons */
        .filters {
            display: flex;
            gap: 14px;
            margin-top: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .filter-group label {
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .filter-group input[type="radio"] {
            display: none;
        }

        .filter-group label span {
            padding: 8px 16px;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-block;
        }

        .filter-group input[type="radio"]:checked + span {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .filter-group label:hover span {
            border-color: var(--accent-blue);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Results Info */
        .results-info {
            display: none;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }

        .results-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .stat strong {
            color: var(--text-primary);
        }

        /* Results - Clean cards */
        .results {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .result-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            transition: all 0.2s;
            position: relative;
        }

        .result-item:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .result-item.keyboard-selected {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 15px;
            margin-bottom: 12px;
        }

        .result-title-section {
            flex: 1;
        }

        .result-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .result-page-name {
            color: var(--accent-blue);
            font-size: 13px;
            font-weight: 500;
        }

        .result-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .badge-score {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
        }

        .badge-match {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }
        
        .badge-context-boost {
            background: rgba(124, 58, 237, 0.2);
            color: var(--accent-purple);
            border: 1px solid rgba(124, 58, 237, 0.3);
            animation: contextPulse 2s infinite;
        }
        
        @keyframes contextPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(124, 58, 237, 0.4); }
            50% { box-shadow: 0 0 8px rgba(124, 58, 237, 0.6); }
        }

        .result-source {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-snippet {
            background: var(--bg-primary);
            border-left: 3px solid var(--accent-blue);
            padding: 12px 16px;
            margin: 16px 0;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            border-radius: 0 4px 4px 0;
        }

        .result-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 13px;
            word-break: break-all;
            display: block;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .result-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .open-btn {
            display: inline-block;
            background: var(--accent-blue);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .open-btn:hover {
            background: var(--accent-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 80px 20px;
        }

        .no-results-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-results-text {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .no-results-hint {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Tips Section */
        .tips {
            text-align: center;
            padding: 80px 20px;
        }

        .tips-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 32px;
        }

        .tips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            max-width: 900px;
            margin: 0 auto;
        }

        .tip-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            text-align: left;
        }

        .tip-card h3 {
            color: var(--accent-blue);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .tip-examples {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }

        .tip-example {
            display: inline-block;
            background: var(--bg-primary);
            padding: 4px 10px;
            border-radius: 4px;
            margin: 2px;
            font-family: 'IBM Plex Mono', 'SF Mono', 'Cascadia Code', 'Courier New', monospace;
            font-size: 12px;
            color: var(--accent-blue);
        }

        /* Sources Section */
        .sources-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            margin-top: 48px;
        }

        .sources-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            user-select: none;
        }

        .sources-header:hover {
            opacity: 0.8;
        }

        .collapse-arrow {
            color: var(--text-secondary);
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .collapse-arrow.collapsed {
            transform: rotate(-90deg);
        }

        .sources-title {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sources-count {
            background: var(--accent-blue);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .sources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
        }

        .sources-grid.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .source-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            transition: all 0.2s;
            position: relative;
        }

        .source-card:hover {
            border-color: var(--accent-blue);
        }

        .source-card.disabled {
            opacity: 0.45;
            border-color: var(--border-color) !important;
            transform: none !important;
        }

        .source-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 48px;
            height: 24px;
            background: var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .source-toggle::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--text-secondary);
            border-radius: 2px;
            top: 4px;
            left: 4px;
            transition: transform 0.2s, background 0.2s;
        }

        .source-toggle.active {
            background: var(--accent-green);
        }

        .source-toggle.active::before {
            transform: translateX(24px);
            background: white;
        }

        .source-name {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .source-type {
            display: inline-block;
            background: var(--bg-tertiary);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: 8px;
        }

        .source-desc {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 8px;
        }

        .source-pages {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 12px;
        }

        /* Keyboard hint */
        .keyboard-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 14px;
            font-size: 12px;
            color: var(--text-secondary);
            display: none;
            gap: 12px;
            z-index: 100;
        }

        .keyboard-hint.visible {
            display: flex;
        }

        .kbd {
            display: inline-block;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 1px 5px;
            font-size: 11px;
            color: var(--text-primary);
            font-family: monospace;
        }

        /* Error message */
        .error-message {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-red);
            border-radius: 4px;
            padding: 20px;
            color: var(--accent-red);
            text-align: center;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-primary);
            margin: 2% auto;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .modal-close {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--bg-tertiary);
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .modal-btn-primary {
            background: var(--accent-green);
            color: white;
        }

        .modal-btn-primary:hover {
            background: var(--accent-green-hover);
        }

        .modal-btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .modal-btn-secondary:hover {
            background: var(--bg-tertiary);
        }

        /* Markdown Content */
        .markdown-content {
            color: var(--text-primary);
            line-height: 1.6;
        }

        .markdown-content h1 {
            color: var(--accent-blue);
            font-size: 2em;
            margin-top: 24px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .markdown-content h2 {
            color: var(--accent-blue);
            font-size: 1.5em;
            margin-top: 24px;
            margin-bottom: 16px;
        }

        .markdown-content h3 {
            color: var(--accent-blue);
            font-size: 1.25em;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .markdown-content p {
            margin-bottom: 16px;
        }

        .markdown-content code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 2px;
            font-family: 'IBM Plex Mono', 'SF Mono', 'Cascadia Code', 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--accent-red);
        }

        .markdown-content pre {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 16px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        .markdown-content pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 16px;
            padding-left: 24px;
        }

        .markdown-content li {
            margin-bottom: 8px;
        }

        .markdown-content blockquote {
            border-left: 4px solid var(--border-color);
            padding-left: 16px;
            margin: 16px 0;
            color: var(--text-secondary);
        }

        .markdown-content a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .markdown-content a:hover {
            text-decoration: underline;
        }

        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-content th {
            background: var(--bg-secondary);
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }

            .sources-grid {
                grid-template-columns: 1fr;
            }

            .result-header {
                flex-direction: column;
            }

            .tips-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header with Logo -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">📖</div>
                <div class="logo-text">
                    <h1>ENGRAM</h1>
                    <p>Knowledge base indexer</p>
                </div>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">
                <span id="themeIcon">☀️</span>
                <span class="theme-toggle-text" id="themeText">Light</span>
            </button>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search for anything..." autocomplete="off">
                <div class="search-hint">💡 Tips: Try misspellings - fuzzy search will still find it!</div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <span class="filter-label">Fuzzy:</span>
                    <label>
                        <input type="radio" name="fuzzyMode" value="off">
                        <span>Off</span>
                    </label>
                    <label>
                        <input type="radio" name="fuzzyMode" value="normal" checked>
                        <span>Normal</span>
                    </label>
                    <label>
                        <input type="radio" name="fuzzyMode" value="prefer">
                        <span>Prefer</span>
                    </label>
                </div>
                
                <div class="filter-group">
                    <span class="filter-label">Source:</span>
                    <label>
                        <input type="radio" name="sourceMode" value="all" checked>
                        <span>All</span>
                    </label>
                    <label>
                        <input type="radio" name="sourceMode" value="local">
                        <span>📁 Local</span>
                    </label>
                    <label>
                        <input type="radio" name="sourceMode" value="online">
                        <span>🌐 Online</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: var(--text-secondary);">Searching...</p>
        </div>

        <!-- Results Info -->
        <div class="results-info" id="resultsInfo">
            <div class="results-stats">
                <span class="stat" id="resultsCount"></span>
                <span class="stat" id="searchStats"></span>
            </div>
        </div>

        <!-- Results -->
        <div class="results" id="results"></div>

        <!-- Tips -->
        <!-- Hide the Tips section for now, can be re-enabled later if needed
        <div class="tips" id="tips">
            <div class="tips-title">💡 Example Searches</div>
            <div class="tips-grid">
                <div class="tip-card">
                    <h3>🔐 Services</h3>
                    <div class="tip-examples">
                        <span class="tip-example">ssh</span>
                        <span class="tip-example">kerberos</span>
                        <span class="tip-example">smb</span>
                        <span class="tip-example">ldap</span>
                    </div>
                </div>
                <div class="tip-card">
                    <h3>🌐 Web Attacks</h3>
                    <div class="tip-examples">
                        <span class="tip-example">sql injection</span>
                        <span class="tip-example">xss</span>
                        <span class="tip-example">csrf</span>
                    </div>
                </div>
                <div class="tip-card">
                    <h3>💻 Privilege Escalation</h3>
                    <div class="tip-examples">
                        <span class="tip-example">windows privesc</span>
                        <span class="tip-example">linux privesc</span>
                    </div>
                </div>
                <div class="tip-card">
                    <h3>🛠️ Tools</h3>
                    <div class="tip-examples">
                        <span class="tip-example">nmap</span>
                        <span class="tip-example">burp</span>
                        <span class="tip-example">metasploit</span>
                    </div>
                </div>
            </div>
        </div>
    -->

        <!-- Sources Section -->
        <div class="sources-section" id="sourcesSection">
            <div class="sources-header" onclick="toggleSources()">
                <div class="sources-title">
                    📚 Indexed Sources
                    <span class="sources-count" id="sourcesCount">Loading...</span>
                </div>
                <div class="collapse-arrow" id="collapseArrow">▼</div>
            </div>
            <div class="sources-grid" id="sourcesGrid"></div>
        </div>
    </div>

    <!-- Markdown Preview Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="modalTitle">Loading...</div>
                    <div class="modal-subtitle" id="modalSubtitle"></div>
                </div>
                <button class="modal-close" onclick="closePreview()">✕ Close</button>
            </div>
            <div class="modal-body">
                <div class="markdown-content" id="modalContent">
                    <p style="text-align: center; color: var(--text-secondary);">Loading...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" onclick="copyFilePath()">📋 Copy path</button>
                <button class="modal-btn modal-btn-primary" onclick="closePreview()">Close</button>
            </div>
        </div>
    </div>

    <!-- Keyboard shortcuts hint -->
    <div class="keyboard-hint" id="keyboardHint">
        <span><span class="kbd">↑↓</span> Navigate</span>
        <span><span class="kbd">Esc</span> Clear</span>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const loadingDiv = document.getElementById('loading');
        const resultsInfo = document.getElementById('resultsInfo');
        const tipsDiv = document.getElementById('tips');
        const sourcesSection = document.getElementById('sourcesSection');
        const sourcesGrid = document.getElementById('sourcesGrid');
        const sourcesCount = document.getElementById('sourcesCount');
        const resultsCount = document.getElementById('resultsCount');
        const searchStats = document.getElementById('searchStats');
        const collapseArrow = document.getElementById('collapseArrow');

        let searchTimeout;
        let sourcesCollapsed = false;
        let currentFilePath = null;
        let fuzzyMode = 'normal';
        let sourceMode = 'all';
        let allSearchResults = [];
        let selectedResultIndex = -1;

        let disabledSources = new Set(
            JSON.parse(localStorage.getItem('disabledSources') || '[]')
        );

        // ── Theme ──────────────────────────────────────────────
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);

        function applyTheme(theme) {
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('themeIcon').textContent = '🌙';
                document.getElementById('themeText').textContent = 'Dark';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeIcon').textContent = '☀️';
                document.getElementById('themeText').textContent = 'Light';
            }
        }

        function toggleTheme() {
            const current = localStorage.getItem('theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            applyTheme(next);
        }
        // ── End Theme ──────────────────────────────────────────

        const savedFuzzyMode = localStorage.getItem('fuzzyMode');
        if (savedFuzzyMode) {
            fuzzyMode = savedFuzzyMode;
            const radio = document.querySelector(`input[name="fuzzyMode"][value="${savedFuzzyMode}"]`);
            if (radio) radio.checked = true;
        }

        const savedSourceMode = localStorage.getItem('sourceMode');
        if (savedSourceMode) {
            sourceMode = savedSourceMode;
            const radio = document.querySelector(`input[name="sourceMode"][value="${savedSourceMode}"]`);
            if (radio) radio.checked = true;
        }

        function updateFuzzyHint() {
            const hint = document.getElementById('searchHint');
            if (!hint) return;
            if (fuzzyMode === 'off') {
                hint.textContent = '🎯 Exact search only - results must match precisely';
            } else if (fuzzyMode === 'normal') {
                hint.textContent = '💡 Fuzzy search active - exact matches rank higher';
            } else if (fuzzyMode === 'prefer') {
                hint.textContent = '🔍 Fuzzy search preferred - finds approximate matches first';
            }
        }

        document.querySelectorAll('input[name="fuzzyMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                fuzzyMode = e.target.value;
                localStorage.setItem('fuzzyMode', fuzzyMode);
                updateFuzzyHint();
                if (searchInput.value.trim()) {
                    performSearch(searchInput.value.trim());
                }
            });
        });

        updateFuzzyHint();

        document.querySelectorAll('input[name="sourceMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                sourceMode = e.target.value;
                localStorage.setItem('sourceMode', sourceMode);
                if (allSearchResults.length > 0) {
                    displayResults(filterResults(allSearchResults));
                }
            });
        });

        function toggleSource(sourceId) {
            if (disabledSources.has(sourceId)) {
                disabledSources.delete(sourceId);
            } else {
                disabledSources.add(sourceId);
            }
            localStorage.setItem('disabledSources', JSON.stringify([...disabledSources]));
            const card = document.getElementById(`source-card-${sourceId}`);
            const toggle = card.querySelector('.source-toggle');
            if (disabledSources.has(sourceId)) {
                card.classList.add('disabled');
                toggle.classList.remove('active');
                toggle.title = 'Enable source';
            } else {
                card.classList.remove('disabled');
                toggle.classList.add('active');
                toggle.title = 'Disable source';
            }
            if (allSearchResults.length > 0) {
                displayResults(filterResults(allSearchResults));
            }
        }

        function toggleSources() {
            sourcesCollapsed = !sourcesCollapsed;
            if (sourcesCollapsed) {
                sourcesGrid.classList.add('collapsed');
                collapseArrow.classList.add('collapsed');
            } else {
                sourcesGrid.classList.remove('collapsed');
                collapseArrow.classList.remove('collapsed');
            }
        }

        async function openPreview(filePath, title, pageName) {
            currentFilePath = filePath;
            const modal = document.getElementById('previewModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalSubtitle = document.getElementById('modalSubtitle');
            const modalContent = document.getElementById('modalContent');
            modal.style.display = 'block';
            modalTitle.textContent = title;
            modalSubtitle.textContent = `📁 ${pageName}`;
            modalContent.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Loading...</p>';
            try {
                const response = await fetch(`/api/preview?file=${encodeURIComponent(filePath)}`);
                const data = await response.json();
                if (data.error) {
                    modalContent.innerHTML = `<p style="color: var(--accent-red);">Error: ${data.error}</p>`;
                } else {
                    modalContent.innerHTML = data.html;
                }
            } catch (error) {
                modalContent.innerHTML = `<p style="color: var(--accent-red);">Could not load file preview</p>`;
            }
        }

        function closePreview() {
            document.getElementById('previewModal').style.display = 'none';
            currentFilePath = null;
        }

        async function openCachedPage(sourceId, url, title) {
            currentFilePath = null;
            const modal = document.getElementById('previewModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalSubtitle = document.getElementById('modalSubtitle');
            const modalContent = document.getElementById('modalContent');
            modal.style.display = 'block';
            modalTitle.textContent = title + ' (Offline)';
            modalSubtitle.textContent = `📱 Cached from ${sourceId}`;
            modalContent.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Loading cached page...</p>';
            try {
                const response = await fetch(`/api/cached-page?source_id=${encodeURIComponent(sourceId)}&url=${encodeURIComponent(url)}`);
                const data = await response.json();
                if (data.error) {
                    modalContent.innerHTML = `
                        <div style="text-align: center; padding: 40px;">
                            <p style="color: var(--accent-red); font-size: 18px; margin-bottom: 16px;">❌ ${data.error}</p>
                            <p style="color: var(--text-secondary);">${data.message || ''}</p>
                            <br>
                            <a href="${url}" target="_blank" class="open-btn">🌐 Open online instead</a>
                        </div>`;
                } else {
                    modalContent.innerHTML = data.html;
                }
            } catch (error) {
                modalContent.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <p style="color: var(--accent-red);">Could not load cached page</p>
                        <br>
                        <a href="${url}" target="_blank" class="open-btn">🌐 Open online instead</a>
                    </div>`;
            }
        }

        function copyFilePath() {
            if (currentFilePath) {
                navigator.clipboard.writeText(currentFilePath);
                alert('📋 Path copied to clipboard!');
            }
        }

        window.onclick = function (event) {
            const modal = document.getElementById('previewModal');
            if (event.target === modal) closePreview();
        };

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                const modal = document.getElementById('previewModal');
                if (modal.style.display === 'block') { closePreview(); return; }
                searchInput.value = '';
                resultsDiv.innerHTML = '';
                resultsInfo.style.display = 'none';
                tipsDiv.style.display = 'block';
                sourcesSection.style.display = 'block';
                allSearchResults = [];
                selectedResultIndex = -1;
                document.getElementById('keyboardHint').classList.remove('visible');
                searchInput.focus();
                return;
            }
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                const resultItems = document.querySelectorAll('.result-item');
                if (resultItems.length === 0) return;
                event.preventDefault();
                if (selectedResultIndex >= 0 && resultItems[selectedResultIndex]) {
                    resultItems[selectedResultIndex].classList.remove('keyboard-selected');
                }
                if (event.key === 'ArrowDown') {
                    selectedResultIndex = Math.min(selectedResultIndex + 1, resultItems.length - 1);
                } else {
                    selectedResultIndex = Math.max(selectedResultIndex - 1, 0);
                }
                resultItems[selectedResultIndex].classList.add('keyboard-selected');
                resultItems[selectedResultIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        });

        async function loadSources() {
            try {
                const response = await fetch('/api/sources');
                const data = await response.json();
                const cacheResponse = await fetch('/api/cache-status');
                const cacheData = await cacheResponse.json();
                const cacheMap = {};
                if (cacheData.sources) {
                    cacheData.sources.forEach(s => { cacheMap[s.source_id] = s; });
                }
                if (data.sources && data.sources.length > 0) {
                    sourcesCount.textContent = `${data.total} sources`;
                    sourcesGrid.innerHTML = data.sources.map(source => {
                        const isDisabled = disabledSources.has(source.id);
                        const cacheInfo = cacheMap[source.id];
                        const cacheBadge = cacheInfo
                            ? `<span class="cache-badge" style="background: #1f6feb; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px;">Cached</span>`
                            : '';
                        return `
                            <div class="source-card ${isDisabled ? 'disabled' : ''}" id="source-card-${source.id}">
                                <div class="source-toggle ${isDisabled ? '' : 'active'}"
                                     onclick="event.stopPropagation(); toggleSource('${source.id}')"
                                     title="${isDisabled ? 'Enable source' : 'Disable source'}">
                                </div>
                                <div class="source-name" style="padding-right: 44px;">
                                    ${escapeHtml(source.name)}
                                    <span class="source-type">${source.type}</span>
                                    ${cacheBadge}
                                </div>
                                ${source.description ? `<div class="source-desc">${escapeHtml(source.description)}</div>` : ''}
                                <div class="source-pages">
                                    📄 ${source.page_count} pages indexed
                                    ${cacheInfo ? `<br>💾 ${cacheInfo.size_mb} MB cached` : ''}
                                </div>
                            </div>`;
                    }).join('');
                } else {
                    sourcesSection.style.display = 'none';
                }
            } catch (error) {
                console.error('Could not load sources:', error);
                sourcesSection.style.display = 'none';
            }
        }

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            selectedResultIndex = -1;
            document.querySelectorAll('.result-item.keyboard-selected')
                .forEach(el => el.classList.remove('keyboard-selected'));
            if (query.length === 0) {
                resultsDiv.innerHTML = '';
                resultsInfo.style.display = 'none';
                tipsDiv.style.display = 'block';
                sourcesSection.style.display = 'block';
                allSearchResults = [];
                document.getElementById('keyboardHint').classList.remove('visible');
                return;
            }
            tipsDiv.style.display = 'none';
            searchTimeout = setTimeout(() => { performSearch(query); }, 400);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                if (query.length > 0) performSearch(query);
            }
        });

        async function performSearch(query) {
            loadingDiv.style.display = 'block';
            resultsDiv.innerHTML = '';
            resultsInfo.style.display = 'none';
            
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        query, 
                        fuzzyMode: fuzzyMode
                    })
                });
                const data = await response.json();
                loadingDiv.style.display = 'none';
                if (data.error) {
                    resultsDiv.innerHTML = `
                        <div class="error-message">
                            <h3>${data.error}</h3>
                            <p style="margin-top: 10px;">Kör: <code>npm run index</code></p>
                        </div>`;
                    return;
                }
                if (data.count === 0) {
                    resultsDiv.innerHTML = `
                        <div class="no-results">
                            <div class="no-results-icon">🔍</div>
                            <div class="no-results-text">0 results found</div>
                            <div class="no-results-hint">Try another search term or check spelling</div>
                        </div>`;
                } else {
                    resultsInfo.style.display = 'block';
                    resultsCount.innerHTML = `<strong>${data.count}</strong> results for "<strong>${escapeHtml(query)}</strong>"`;
                    searchStats.textContent = `Searched through ${data.total_searched} sidor in ${data.search_time_ms}ms`;
                    allSearchResults = data.results;
                    selectedResultIndex = -1;
                    displayResults(filterResults(allSearchResults));
                    document.getElementById('keyboardHint').classList.add('visible');
                }
            } catch (error) {
                loadingDiv.style.display = 'none';
                resultsDiv.innerHTML = `
                    <div class="error-message">
                        <h3>❌ Connection error</h3>
                        <p style="margin-top: 10px;">Check that server is running: <code>npm start</code></p>
                    </div>`;
            }
        }

        function filterResults(results) {
            let filtered = results.filter(r => !disabledSources.has(r.source_id));
            if (sourceMode === 'local') filtered = filtered.filter(r => r.is_local === true);
            else if (sourceMode === 'online') filtered = filtered.filter(r => !r.is_local);
            return filtered;
        }

        function displayResults(results) {
            resultsDiv.innerHTML = results.map(result => {
                const isLocal = result.url && result.url.startsWith('file://');
                const isCached = result.is_cached === true || result.cache_hash;
                let badge = '';
                if (isLocal) badge = '<span class="badge" style="background: var(--accent-purple);">📁 Local</span>';
                else if (isCached) badge = '<span class="badge" style="background: var(--accent-green);">📱 Cached</span>';

                let openButton;
                if (isLocal) {
                    openButton = `<button class="open-btn" onclick="openPreview('${escapeHtml(result.file_path || result.url.replace('file://', ''))}', '${escapeHtml(result.title)}', '${escapeHtml(result.page_name)}')">👁️ Preview</button>`;
                } else if (isCached) {
                    openButton = `
                        <button class="open-btn" onclick="openCachedPage('${escapeHtml(result.source_id)}', '${escapeHtml(result.url)}', '${escapeHtml(result.title)}')">📱 Offline Preview</button>
                        <a href="${result.url}" class="open-btn" style="background: var(--bg-tertiary); margin-left: 8px;" target="_blank">🌐 Online</a>`;
                } else {
                    openButton = `<a href="${result.url}" class="open-btn" target="_blank">Open page →</a>`;
                }

                let snippetHTML = '';
                if (result.snippet) {
                    if (typeof result.snippet === 'string') {
                        snippetHTML = `<div class="result-snippet">${escapeHtml(result.snippet)}</div>`;
                    } else if (result.snippet.text) {
                        snippetHTML = `<div class="result-snippet">${escapeHtml(result.snippet.text)}</div>`;
                    }
                }

                return `
                <div class="result-item">
                    <div class="result-header">
                        <div class="result-title-section">
                            <div class="result-title">${escapeHtml(result.title)}</div>
                            <div class="result-page-name">📄 ${escapeHtml(result.page_name)}</div>
                        </div>
                        <div class="result-badges">
                            ${badge}
                            <span class="badge badge-score">${result.relevance_score}</span>
                            <span class="badge badge-match">${formatMatchType(result.match_type)}</span>
                        </div>
                    </div>
                    <div class="result-source">📚 ${escapeHtml(result.source_name)}</div>
                    ${snippetHTML}
                    ${isLocal
                        ? `<div class="result-link" style="color: var(--text-secondary); cursor: default;">📁 ${escapeHtml(result.file_path || result.url.replace('file://', ''))}</div>`
                        : `<a href="${result.url}" class="result-link" target="_blank">${result.url}</a>`
                    }
                    ${openButton}
                </div>`;
            }).join('');
        }

        function formatMatchType(type) {
            const types = {
                'exact_title': '🎯 Exact',
                'title_contains': '📌 Title',
                'page_name': '📄 Pagename',
                'url': '🔗 URL',
                'content': '📝 Content',
                'fuzzy': '🔍 Fuzzy'
            };
            return types[type] || type;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        window.addEventListener('load', () => { 
            searchInput.focus();
        });
        loadSources();
        searchInput.addEventListener('focus', () => {
            if (!searchInput.value) tipsDiv.style.display = 'block';
        });
    </script>
</body>
</html>
